name: MAO Tarayıcı Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Flutter 3.44.8 kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - name: Flutter sürümünü kontrol et
        run: flutter --version

      - name: Flet kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: APK oluştur
        run: |
          flet build apk androidmaot.py

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: MAO-Tarayici-APK
          path: build/apk/*.apk
          if-no-files-found: error
