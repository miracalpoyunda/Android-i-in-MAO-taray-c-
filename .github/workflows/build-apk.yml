name: MAO Tarayici Android APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Flet project
        run: |
          mkdir -p mao_app
          cp androidmaot.py mao_app/main.py
          cp requirements.txt mao_app/requirements.txt

      - name: Build APK
        working-directory: mao_app
        run: flet build apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAO-Tarayici-APK
          path: mao_app/build/apk/*.apk
          if-no-files-found: error
